<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作文批改助手 · 全流程</title>
<style>
  :root{--brand:#f5633f;--brand-d:#e2552f;--ink:#1f2733;--ink2:#5c6b7a;
    --line:#ebedf0;--bg:#f2f4f6;--red:#e94a3f;--blue:#2e6be6;--green:#2f8f57}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:14px}
  .view{display:none;height:100vh;flex-direction:column;overflow:hidden}
  .view.on{display:flex}

  .top{flex:0 0 auto;height:54px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:0 18px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .brand-logo{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center}
  .top .gap{flex:1}
  .docTitle{font-weight:600;font-size:15px;text-align:center}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.ghost{color:var(--ink2)}
  .btn.block{width:100%;height:42px;font-size:15px}
  .back{border:0;background:none;color:var(--ink2);cursor:pointer;font-size:13px}

  main{flex:1;display:flex;min-height:0}

  .panel{flex:0 0 336px;background:#fff;border-right:1px solid var(--line);
    padding:20px 22px;overflow:auto}
  .ph{display:flex;gap:12px;align-items:center;margin-bottom:20px}
  .ph-icon{width:44px;height:44px;border-radius:10px;background:#fdeee9;color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .ph-title{margin:0;font-size:16px;font-weight:700}
  .ph-sub{margin:2px 0 0;color:var(--ink2);font-size:12px}
  .lbl{display:block;margin:0 0 7px;font-size:13px;color:#3b4757;font-weight:600}
  .sel{width:100%;height:38px;border:1px solid #dfe3e8;border-radius:8px;padding:0 12px;
    background:#fff;color:var(--ink);font-size:14px;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,#9aa5b1 50%),linear-gradient(135deg,#9aa5b1 50%,transparent 50%);
    background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .row2{display:flex;gap:12px;margin-top:16px}
  .row2>div{flex:1}
  .tabs{display:flex;gap:20px;margin:22px 0 14px;border-bottom:1px solid var(--line)}
  .tab{padding:0 0 11px;color:var(--ink2);cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
  .tab.active{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
  .dropzone{display:block;border:1.5px dashed #d7dce2;border-radius:12px;
    padding:34px 20px;text-align:center;cursor:pointer;background:#fcfdfe}
  .dropzone:hover{border-color:var(--brand);background:#fffaf8}
  .dz-icon{width:48px;height:48px;border-radius:12px;background:var(--brand);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
  .dz-main{margin:0 0 8px;font-size:14px;color:#3b4757}
  .dz-main a{color:var(--brand);font-weight:600;text-decoration:none}
  .dz-hint{margin:0 0 10px;color:#9aa5b1;font-size:12px;line-height:1.7}
  .dz-sample{color:var(--brand);font-size:13px;text-decoration:none;font-weight:600}
  .uploaded{margin:0 0 10px;color:var(--ink2);font-size:13px}
  .thumbcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;margin-bottom:14px}
  .thumbcard svg,.thumbcard img{display:block;width:100%}
  .thumbcard .ok{position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:50%;
    background:#39b54a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
  .thumbcard .fname{background:#5b646e;color:#fff;font-size:12px;padding:5px 10px}
  .stage{flex:1;min-width:0;display:flex;overflow:hidden}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .empty-icon{width:86px;height:86px;border-radius:50%;background:#fdeee9;color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-size:34px}
  .empty h3{margin:14px 0 0;font-size:18px}
  .empty p{margin:0;color:var(--ink2);font-size:13px}

  .loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .spinner{width:64px;height:64px;border-radius:50%;
    background:conic-gradient(var(--brand) 0 90deg,#f9ddd4 90deg 360deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
    animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading .lcopy{text-align:center}
  .loading .l1{margin:0 0 8px;font-size:17px;color:#3b4757}
  .loading .l2{margin:0;font-size:14px;color:#8b95a1}

  .mid{flex:1;min-width:0;overflow:auto;padding:22px 26px}
  .mid-head h2{margin:0 0 10px;font-size:20px;display:inline-block;vertical-align:middle}
  .tag{display:inline-block;vertical-align:middle;border-radius:8px;padding:3px 10px;font-size:12px;margin-left:8px}
  .tag.new{background:#fdeee9;color:var(--brand)}
  .tag.warn{background:#fff4e5;color:#c8791c}
  .mid-head p{color:var(--ink2);font-size:13px;line-height:1.9;margin:8px 0 18px}
  .mid-head p b{color:var(--brand)}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h4{margin:0 0 12px;font-size:14px;color:#3b4757}
  .photo{background:#eef1f4;border-radius:8px;padding:12px}
  .photo svg,.photo img{display:block;width:100%;border-radius:6px}
  .pageno{display:inline-block;background:rgba(31,39,51,.72);color:#fff;
    font-size:11px;border-radius:5px;padding:2px 9px;margin-bottom:8px}
  .recog{font-size:13.5px;line-height:2;margin:16px 0 0}
  .recog .who{font-weight:700;margin-top:12px}
  .recog .lab{color:var(--ink2);font-size:12px;margin-top:14px}

  .form{flex:0 0 420px;background:#fff;border-left:1px solid var(--line);padding:22px;overflow:auto}
  .field{margin-bottom:18px}
  .field .fl{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .field .fl b{font-size:14px;color:#3b4757}
  .field .fl .sub{color:#9aa5b1;font-size:12px;line-height:1.6}
  .badge{background:#fdeee9;color:var(--brand);font-size:12px;border-radius:6px;padding:2px 8px;font-weight:600}
  .field textarea{width:100%;border:1px solid #dfe3e8;border-radius:10px;padding:12px;
    font-size:13.5px;line-height:1.9;color:#2b3646;resize:vertical;font-family:inherit;background:#fff;min-height:110px}
  .field textarea:focus{outline:none;border-color:var(--brand)}

  .thumbs{flex:0 0 96px;background:#fff;border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
  .thumbs .lbl2{font-size:12px;color:var(--ink2);margin:0 0 8px 2px}
  .thumb{border:2px solid var(--brand);border-radius:8px;overflow:hidden;margin-bottom:10px}
  .thumb svg,.thumb img{display:block;width:100%}
  .canvas-wrap{flex:1;min-width:0;overflow:auto;padding:22px 26px}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 2px 12px rgba(31,39,51,.06);max-width:780px;margin:0 auto;padding:32px 30px 40px}
  .sheet h1{font-size:19px;text-align:center;margin:0 0 20px;letter-spacing:2px}
  .para{display:grid;grid-template-columns:1fr 240px;gap:24px;padding:9px 0}
  .text{font-size:15.5px;line-height:2.6;text-indent:2em;color:#243040}
  .note{font-size:13px;line-height:1.85;color:#2b3646;
    font-family:"Kaiti SC","STKaiti",cursive;border-left:2px solid #f2c9c4;padding-left:11px}
  .note .q{color:var(--red)}
  .note .b{color:var(--blue)}
  .note .g{color:var(--green)}
  .good{text-decoration:underline wavy var(--red);text-underline-offset:5px;text-decoration-thickness:2px}
  .avatar{width:30px;height:30px;border-radius:50%;background:#fbe3df;color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

  /* 小学修改符号：改正 / 删除 / 增补 */
  .rep,.del{position:relative;display:inline-block;padding:2px 9px;line-height:1.35;
    vertical-align:middle;border:2px solid var(--red);
    border-radius:50% 50% 48% 52%/62% 62% 38% 38%}
  .rep{margin:8px 14px 2px 4px}
  .del{margin:6px 0 2px}
  .rep i{position:absolute;right:-8px;top:-28px;font-style:normal;background:#fff;
    color:var(--red);font-weight:700;font-size:13px;white-space:nowrap;line-height:1.35;
    border:2px solid var(--red);border-radius:50% 50% 48% 52%/64% 64% 36% 36%;
    padding:1px 9px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .rep::after{content:"";position:absolute;right:10px;top:-15px;width:16px;height:16px;
    border-left:2px solid var(--red);border-top:2px solid var(--red);border-radius:16px 0 0 0}
  .del .coil{position:absolute;right:-30px;top:-17px;width:32px;height:16px;overflow:visible}
  .add{position:relative;display:inline-block;padding:0 4px;color:var(--red);
    font-weight:700;font-size:16px;line-height:1;vertical-align:middle}
  .add::after{content:"";position:absolute;left:10px;bottom:2px;width:14px;height:20px;
    border-left:2px solid var(--red);border-top:2px solid var(--red);border-radius:15px 0 0 0}
  .add i{position:absolute;left:22px;bottom:22px;font-style:normal;color:var(--red);
    font-weight:700;font-size:13px;white-space:nowrap;line-height:1.35;background:#fff;
    border:2px solid var(--red);border-radius:50% 50% 48% 52%/64% 64% 36% 36%;padding:1px 9px}

  .legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:12px;
    color:var(--ink2);max-width:820px;margin:14px auto 0}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend b{width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;position:relative}
  .lgrep::before,.lgrep::after{content:"";position:absolute;width:15px;height:12px;
    border:2px solid var(--red);border-radius:50%}
  .lgrep::before{left:0;top:10px}
  .lgrep::after{right:0;top:1px}
  .lgdel::before{content:"";position:absolute;left:0;top:12px;width:15px;height:11px;
    border:2px solid var(--red);border-radius:50%}
  .lgdel svg{position:absolute;right:0;top:1px;width:17px;height:14px}
  .lgadd::before{content:"∧";position:absolute;left:0;bottom:1px;color:var(--red);
    font-weight:700;font-size:14px;line-height:1}
  .lgadd::after{content:"";position:absolute;left:9px;bottom:2px;width:14px;height:13px;
    border-left:2px solid var(--red);border-top:2px solid var(--red);border-radius:13px 0 0 0}
  .side{flex:0 0 348px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side-tabs{display:flex;gap:6px;padding:12px 14px 0;border-bottom:1px solid var(--line)}
  .side-tab{padding:7px 4px 11px;font-size:14px;color:var(--ink2);cursor:pointer;
    border-bottom:2px solid transparent;white-space:nowrap}
  .side-tab.active{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
  .side-body{padding:16px 18px 30px;overflow:auto;flex:1;font-size:14px;line-height:1.9;color:#2b3646}
  .side-body h3{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
  .side-body h3::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .side-body p{margin:0 0 12px}
  .side-body .sub{font-weight:700;color:var(--ink)}
  .side-body .g{color:var(--green)}
  .side-body .q{color:var(--red)}
  .sig{display:flex;gap:8px;margin:0 0 8px;align-items:flex-start}
  .lv{flex:0 0 auto;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
  .lv.strong{background:#e7f6ec;color:#2f8f57}
  .lv.ok{background:#eef2f7;color:#5c6b7a}
  .tipbox{background:#f6f8fb;border-radius:10px;padding:14px 16px;margin-top:8px}
  footer.tools{flex:0 0 auto;height:56px;background:#3a4553;display:flex;align-items:center;
    gap:2px;padding:0 10px;overflow-x:auto}
  .tool{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:#dfe5ec;font-size:11px;padding:6px 0;background:none;border:0}
  .tool svg{width:18px;height:18px}
  .modal-mask{position:fixed;inset:0;background:rgba(31,39,51,.45);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-mask.on{display:flex}
  .modal{width:420px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-head{padding:16px 20px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line)}
  .modal-body{padding:20px}
  .modal-body .row{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:14px}
  .modal-body .lbl{color:var(--ink2);width:70px;flex:0 0 auto}
  .modal-body .fmt{display:flex;gap:16px}
  .modal-body .fmt label{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--ink)}
  .modal-body .tip{color:var(--ink2);font-size:12px;margin:0}
  .modal-body .warn{color:var(--brand);font-weight:700;margin:0 0 8px}
  .modal-body .msg-row{align-items:flex-start}
  .modal-body .msg-row .lbl{padding-top:6px}
  .modal-body textarea{flex:1;border:1px solid #dfe3e8;border-radius:8px;padding:10px;font-size:13px;line-height:1.7;color:#2b3646;resize:vertical;font-family:inherit;min-height:92px}
  .modal-body textarea:focus{outline:none;border-color:var(--brand)}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
  .demo-switch{margin-left:auto;font-size:12px;color:#9aa5b1}
  .demo-switch a{color:var(--brand);cursor:pointer;margin:0 3px}
  .demo-switch a.on{font-weight:700;text-decoration:underline}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(31,39,51,.9);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:110;display:none}
  .preview-body{flex:1;overflow:auto;padding:28px 40px}
  .preview-paper{max-width:780px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:34px 38px;box-shadow:0 2px 12px rgba(31,39,51,.06);font-size:14px;line-height:1.9;color:#2b3646}
  .preview-paper h3{font-size:16px;margin:0 0 12px;display:flex;gap:8px;align-items:center;color:#1f2733}
  .preview-paper h3::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .preview-paper p{margin:0 0 12px}
  .preview-paper .dim{margin:0 0 12px}
  .preview-paper .dim b{color:#1f2733}
  .preview-paper .sub{font-weight:700;color:var(--ink);display:block;margin:14px 0 4px}
  .preview-paper .q{color:var(--red)}
  .preview-paper .g{color:var(--green)}
  .preview-paper .sig{display:flex;gap:8px;margin:0 0 8px;align-items:flex-start}
  .preview-paper .lv{flex:0 0 auto;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
  .preview-paper .lv.strong{background:#e7f6ec;color:#2f8f57}
  .preview-paper .lv.ok{background:#eef2f7;color:#5c6b7a}
  .preview-paper .tipbox{background:#f6f8fb;border-radius:10px;padding:14px 16px;margin-top:8px}
  .report{max-width:780px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:34px 38px;box-shadow:0 2px 12px rgba(31,39,51,.06);font-size:14px;line-height:1.9;color:#2b3646}
  .report-title{text-align:center;font-size:22px;font-weight:700;color:var(--brand);letter-spacing:2px}
  .report .meta{text-align:center;color:var(--ink2);font-size:12.5px;margin:4px 0}
  .report .meta.title{color:var(--ink);font-weight:600}
  .report h2{font-size:15px;color:var(--brand);font-weight:700;border-bottom:2px solid var(--brand);padding-bottom:4px;margin:20px 0 10px}
  .report h3{font-size:15px;margin:16px 0 8px;color:var(--ink)}
  .report table.score{width:100%;border-collapse:collapse}
  .report table.score th,.report table.score td{border:1px solid #e3e6ea;padding:6px 10px;text-align:left;font-size:12.5px}
  .report table.score th{background:#f6f8fb;font-weight:600}
  .report table.score td.lv{color:var(--brand);font-weight:700;white-space:nowrap}
  .report table.score td.lv.good{color:var(--green)}
  .report .sugg{margin:5px 0}
  .report .card{margin:6px 0}
  .report .card .no{font-weight:700;margin-right:4px}
  .report .card .tag{font-weight:700;margin-right:6px}
  .report .card.jia .no,.report .card.jia .tag{color:var(--red)}
  .report .card.run .no,.report .card.run .tag{color:var(--blue)}
  .report .card .quote{font-weight:600}
  .report .card .note{color:var(--ink2)}
  .report .upgrade{margin:7px 0}
  .report .upgrade .tag{color:var(--brand);font-weight:700}
  .report .example{color:var(--green);margin:3px 0 3px 1.5em;font-size:13px}
  .report .indent{text-indent:2em}
  .report .sub{font-weight:700;margin:10px 0 4px}
  .export-wrap{position:relative}
  .export-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:none;min-width:132px;z-index:60;overflow:hidden}
  .export-menu.on{display:block}
  .export-menu a{display:block;padding:9px 14px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .export-menu a:hover{background:#f6f8fb}
  .sheet-img{display:grid;grid-template-columns:1fr 240px;gap:24px;align-items:start}
  .sheet-img .img-col img{display:block;width:100%;border-radius:6px}
  .notes-col{font-size:13px;line-height:1.85;color:#2b3646}
  .note-item{font-family:"Kaiti SC","STKaiti",cursive;border-left:2px solid #f2c9c4;padding-left:11px;margin-bottom:14px}
  .note-item .q{color:var(--red)}
  .note-item .b{color:var(--blue)}
  .note-item .g{color:var(--green)}
  .preview-paper .lead{background:linear-gradient(135deg,#fff7f4,#fffdf9);border:1px solid #f6e1d8;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.9;color:#3b4757;margin:16px 0}
  .preview-paper .praise{display:flex;flex-direction:column;gap:8px}
  .preview-paper .praise .item{display:flex;gap:10px;background:#eaf6ef;border:1px solid #dceee2;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.9;color:#2f6b48}
  .preview-paper .praise .tag{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--green);background:#fff;border:1px solid #cfe7d7;border-radius:5px;padding:1px 6px;height:fit-content}
  .preview-paper .problem{background:#fdf0ef;border:1px solid #f4d9d5;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.9;color:#5c3a38}
  .preview-paper .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .preview-paper .compare .box{background:#fff;border:1px solid #eee;border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.85;color:#3b4757}
  .preview-paper .compare .box.after{background:#fffdf8;border-color:#f0e6d0}
  .preview-paper .compare .lbl{display:block;font-size:11px;font-weight:700;margin-bottom:4px}
  .preview-paper .compare .before .lbl{color:#9aa0a8}
  .preview-paper .compare .after .lbl{color:#a85a00}
  .preview-paper .method{background:#eef4fe;border:1px solid #d9e6f7;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.9;color:#2b4a7a}
  .preview-paper .closing{text-align:center;background:#fbf5e8;border:1px solid #eadfc4;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:2;color:#6b5a3a;margin-top:8px}
  .preview-paper .passage{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
  .preview-paper .passage .para{grid-template-columns:1fr 250px;gap:18px;padding:8px 0;border-bottom:1px dashed #e5e9f0}

      {label:"学生作文内容",req:true,
       val:"我的心爱之物\n你的心爱之物是什么？乐高？玩具熊？我的心爱之物是家乡养的小黄狗黄豆。\n黄豆有一双炯炯有神的金色眼睛，而且自带眼线，脸上那块黄色斑点与它身上黑色的毛发格格不入，却彰显着它的独特。\n黄豆十分淘气。\n上次，黄豆在奶奶家看见了邻居家最板上的老鼠，想都不想便扑了上去，结果自己反被扒了一身虱子。我和姐姐为它洗澡，它竟然抓了我一把。\n还有一次，黄豆消失了一整天，大家找遍了整个大院，最终在小狗海海的狗窝里找到了它。它应该是被压住了，大家说干就干，拆了大半个狗窝才看见它——它的后腿上纏了根麻绳，死死地缠住它，动弹不得。最后，黄豆变成了一只瘦猫。\n家雀儿是我们院子的老住户了，一家六口其乐融融地在院西电箱上，在黄豆的出现，打破了它们的快乐生活。\n最开始，黄豆只是眼巴巴地望着雀窝，后来它叫来了附近村子的流浪猫，一起捣鸟巢，可真是一副「大将军」的架子呢！\n就这样，黄豆把老大的院子搞得枝折花落。可惜黄豆在 17 天前走了，院中少了一位「瘸腿将军」，显得空荡荡的。黄豆，我希望某一天你能回到这片土地，让我们的院子重新充满阳光！"}

    canvas:`<h1>我的心爱之物</h1>
      <div class="para"><div class="text">你的心爱之物是什么？乐高？玩具熊？我的心爱之物是家乡养的小黄狗黄豆。</div>
        <div class="note">第一段是开头，作用是亮出心爱之物是什么。写得好——用「乐高？玩具熊？」两个问句吊起兴趣，再点出答案是家乡的小黄狗黄豆，起笔抓人。</div></div>
      <div class="para"><div class="text">黄豆有一双<span class="good">炯炯有神的金色眼睛，而且自带眼线</span>，脸上那块黄色斑点与它身上黑色的毛发<span class="good">格格不入，却彰显着它的独特</span>。</div>
        <div class="note">第二段是写黄豆的样子。用「放大镜」凑近看，抓住<span class="q">「自带眼线」</span><span class="q">「格格不入却彰显独特」</span>，把黄豆的样子写得又准又有个性。</div></div>
      <div class="para"><div class="text">黄豆十分淘气。</div>
        <div class="note">第三段只有一句「黄豆十分淘气」，作用是总起，把下面几件事都罩住了。用一句话单独成段、领起下文，是很清楚的结构写法。</div></div>
      <div class="para"><div class="text">上次，黄豆在奶奶家看见了邻居家<span class="rep">最板上<i>笼子上</i></span>的老鼠，想都不想便扑了上去，结果自己反被<span class="rep">扒<i>沾</i></span>了一身虱子。我和姐姐为它洗澡，它竟然抓了我一把。</div>
        <div class="note">第四段写第一件淘气事（抓老鼠）。写得有画面——看见老鼠「想都不想便扑上去」。如果想要更准，可以把<span class="b">「扒」</span>改成<span class="g">「沾」</span>、<span class="b">「最板上」</span>改成<span class="g">「笼子上」</span>。</div></div>
      <div class="para"><div class="text">还有一次，黄豆消失了一整天，大家找遍了整个大院，最终在小狗海海的狗窝里找到了它。它应该是被压住了，大家说干就干，<span class="good">拆了大半个狗窝才看见它</span>——它的后腿上<span class="rep">纏<i>缠</i></span>了根麻绳，死死地缠住它，动弹不得。最后，黄豆<span class="rep">变成了一只瘦猫<i>瘦了一大圈</i></span>。</div>
        <div class="note">第五段写第二件淘气事（走丢又被找回来），是全文写得最细的一件事，「拆了大半个狗窝」很有画面。如果想要更打动人，可以用「借物抒情·三个问题法」想一想：这件事为什么让你印象最深？字词上，把<span class="b">「变成了一只瘦猫」</span>改成<span class="g">「瘦了一大圈」</span>，繁体「<span class="b">纏</span>」写成<span class="g">「缠」</span>。</div></div>
      <div class="para"><div class="text">家雀儿是我们院子的老住户了，一家六口其乐融融地在院西电箱上，<span class="del">在<svg class="coil" viewBox="0 0 34 16" aria-hidden="true"><path d="M2 14 C6 3 11 3 12 10 C13 16 18 16 19 8 C20 1 25 2 32 6" fill="none" stroke="#e94a3f" stroke-width="2.4" stroke-linecap="round"/></svg></span><span class="add">∧<i>可是</i></span>黄豆的出现，打破了它们的快乐生活。</div>
        <div class="note">第六段把视角转到家雀儿。用「老住户」「一家六口其乐融融」写它们原本的快乐，和后面被打破形成对比。如果想要句子更顺，可以把<span class="b">「在黄豆的出现」</span>改成<span class="g">「可是黄豆的出现」</span>。</div></div>
      <div class="para"><div class="text">最开始，黄豆只是眼巴巴地望着雀窝，后来它叫来了附近村子的流浪猫，一起捣鸟巢，可真是一副<span class="good">「大将军」的架子</span>呢！</div>
        <div class="note">第七段写黄豆逗鸟。写得好——<span class="q">「大将军的架子」</span>这个比喻很传神，把黄豆得意神气的样子写活了，是全文的亮点。</div></div>
      <div class="para"><div class="text">就这样，黄豆把老大的院子搞得<span class="good">枝折花落</span>。可惜黄豆在 17 天前走了，院中少了一位「瘸腿将军」，显得空荡荡的。黄豆，我希望某一天你能回到这片土地，<span class="good">让我们的院子重新充满阳光</span>！</div>
        <div class="note">第八段是结尾，写黄豆离开和自己的不舍。从「枝折花落」的热闹转到「17 天前走了」，落差大、情感真。如果想要更有味道，可以用「借物抒情·联想法」——由黄豆的样子或某个画面，想到它给你的陪伴，把不舍自然地带出来。</div></div>`,

    data:{
      review:`<h3>总评</h3>
        <p>孩子这篇《我的心爱之物》写得很动人，扎实做到了第一单元「写清心爱之物的样子、交代来历、表达喜爱之情」的要求，尤其把和黄豆之间的几件事写得又真又活，是一篇超出同龄平均水平的好作文。</p>
        <p>第一单元习作《我的心爱之物》，要求孩子写一个自己真实拥有的心爱之物，把它的样子、来历写清楚，再通过具体的故事把喜爱之情写出来，还要学着用对比、比喻、拟人把感情融进字里行间。孩子这篇做得很扎实：开头用「你的心爱之物是什么？乐高？玩具熊？」两个问句吊起兴趣，再点出答案是家乡的小黄狗黄豆，起笔就抓人；写样子时用「炯炯有神的金色眼睛，而且自带眼线」「格格不入，却彰显着它的独特」，把黄豆的样子写得又准又有个性；写淘气的事时，「拆了大半个狗窝才看见它」「后腿上缠了根麻绳，死死地缠住它」，画面感很强。最难得的是结尾——「黄豆，我希望某一天你能回到这片土地，让我们的院子重新充满阳光」，把对黄豆的想念写得真诚又不煽情。</p>
        <p>如果要说再往前走一步的地方，主要是「与物有关的故事」还可以写得更聚焦。孩子写了抓老鼠、走丢、逗家雀儿好几件事，都很生动，但每件事都写得比较快、笔墨平均；单元要求是通过一个具体的故事把喜爱之情写具体，可以先挑最能体现黄豆「淘气又可爱」的一件事，把它的动作、神态细细展开，其他几件略写，详略会更分明。另外，个别词句还有小地方要顺一顺，比如「最后，黄豆变成了一只瘦猫」意思没说明白，「在黄豆的出现，打破了它们的快乐生活」读起来不太通，改通顺了整篇会更干净。</p>`,
      detail:`<h3>详细点评</h3>
        <p><b>审题与选材：写的是真实拥有的心爱之物，选材贴题又有判断力。</b>孩子写的是家乡养的小黄狗黄豆，是真实拥有的心爱之物，完全符合第一单元的要求。选材也不随便——不是随手一件东西，而是陪伴自己长大、发生过一连串故事的小狗，能说清「为什么心爱」。审题与对象感都很准。</p>
        <p><b>结构与详略：结构完整，但几件事的详略可以再分明。</b>全文从开头引出黄豆，到写黄豆的样子，用「黄豆十分淘气」一句总起，再依次写抓老鼠、走丢被找、逗家雀儿三件事，最后以不舍收尾，结构清楚、分段合理。不足在于三件事都写得比较快、分量平均。单元要求是「与物有关的故事具体展开」，可以挑最精彩的「走丢被找到」详写——先用「借物抒情·三个问题法」想清楚「这件事为什么最打动我」，再把拆狗窝、发现麻绳的过程写细，其余略写。</p>
        <p><b>语言（含细节与画面感）：画面感强，个别词句还可以再顺。</b>孩子很会用具体画面写事：「拆了大半个狗窝才看见它」「后腿上缠了根麻绳，死死地缠住它」，读着像放电影；写样子时「自带眼线」用得很新鲜。需要顺一顺的有几处：「最后，黄豆变成了一只瘦猫」把小狗写成了猫，意思没说清，应是「瘦了一大圈」；「在黄豆的出现，打破了它们的快乐生活」前面缺了转折词、句子不通，应改成「可是黄豆的出现，打破了它们的快乐生活」。</p>
        <p><b>情感与立意：情感真实，结尾把喜爱之情写出来了。</b>孩子没有空喊「我很喜欢黄豆」，而是通过抓老鼠、走丢、逗鸟这些真事，把黄豆的淘气和自己的喜爱一起写出来，情感有来处。结尾「黄豆，我希望某一天你能回到这片土地，让我们的院子重新充满阳光」，把不舍写得真诚又不煽情，是全文最动人的一笔。如果还想更深一层，可以试试「借物抒情·联想法」，由黄豆的样子或某个画面，联想到它给你的陪伴。</p>

/* ---------- 年级 / 单元联动 ---------- */
const UNITS={"二年级上":["语文园地三 · 我最喜爱的玩具"],"五年级上":["第一单元 · 我的心爱之物"]};
const gradeSel=document.getElementById("grade"), unitSel=document.getElementById("unit");
function fillUnits(){const g=gradeSel.value;unitSel.innerHTML=UNITS[g].map(u=>`<option>${u}</option>`).join("");}
function curKey(){return gradeSel.value==="二年级上"?"picture":"normal";}
function updateUploadTab(){const el=document.getElementById("uploadTab"),pt=document.getElementById("pasteTab"),isPic=curKey()==="picture";if(el)el.textContent=isPic?"↑ 看图写话":"↑ 上传文件";if(pt)pt.style.display=isPic?"none":"";}
gradeSel.addEventListener("change",()=>{fillUnits();updateUploadTab();}); fillUnits(); updateUploadTab();

/* ---------- 视图切换 ---------- */
const views={upload:document.querySelector(".v-upload"),recog:document.querySelector(".v-recog"),
  confirm:document.querySelector(".v-confirm"),correct:document.querySelector(".v-correct"),
  result:document.querySelector(".v-result"),preview:document.querySelector(".v-preview")};
function show(v){for(const k in views)views[k].classList.toggle("on",k===v);window.scrollTo(0,0);}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.go)));

/* ---------- 上传 + 分流判断 ---------- */
const dropArea=document.getElementById("dropArea"), uploadedArea=document.getElementById("uploadedArea");
dropArea.addEventListener("click",()=>{
  const s=S[curKey()];
  document.getElementById("uploadThumb").innerHTML=s.photo+(curKey()==="picture"?`<span class="ok">✓</span><div class="fname">作文照片.jpg</div>`:`<div class="fname">作文照片.jpg</div>`);
  dropArea.style.display="none"; uploadedArea.style.display="block";
  document.getElementById("stu").value=s.student;
});

/* ---------- 提交 → 识别 loading → 确认 ---------- */
document.getElementById("submitBtn").addEventListener("click",()=>{
  const s=S[curKey()];
  document.getElementById("recogCopy").innerHTML=`<p class="l1">${s.recogTitle}</p><p class="l2">${s.recogSub}</p>`;
  show("recog");
  setTimeout(()=>{renderConfirm(s);show("confirm");},1600);
});

/* ---------- 结果页 ---------- */
function renderResult(s){
  document.getElementById("resTitle").textContent=s.title;
  document.getElementById("resThumbs").innerHTML=`<p class="lbl2">图片列表</p>`+s.thumbs;
  document.getElementById("resCanvas").innerHTML=`<div class="sheet sheet-img">
    <div class="img-col">${s.photo}</div>
    <div class="notes-col">${s.comments.map(c=>`<div class="note-item">${c}</div>`).join("")}</div>
  </div>`;
  const tabs=document.getElementById("resTabs"), body=document.getElementById("resBody");
  tabs.innerHTML=s.tabs.map((t,i)=>`<div class="side-tab ${i===0?"active":""}" data-k="${t[0]}">${t[1]}</div>`).join("");
  body.innerHTML=s.data[s.tabs[0][0]];
  tabs.querySelectorAll(".side-tab").forEach(t=>t.addEventListener("click",()=>{
    tabs.querySelectorAll(".side-tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); body.innerHTML=s.data[t.dataset.k];
  }));
}

        <div class="item"><span class="tag">好句</span><span>「拆了大半个狗窝才看见它」「大将军的架子」——画面感强，把黄豆的神气写活了。</span></div>
      </div>
      <h3>这篇最值得改的一处</h3>
      <div class="problem">三件事都写得很平均，详略不够分明。建议挑最动人的「走丢被找到」写细，其余略写。</div>
      <div class="compare">
        <div class="box before"><span class="lbl">改前</span>还有一次，黄豆消失了一整天，大家找遍了整个大院……最后，黄豆变成了一只瘦猫。</div>
        <div class="box after"><span class="lbl">改后</span>还有一次，黄豆一整天没了踪影。我们拆了大半个狗窝才把它扒出来，它后腿缠着麻绳，被救出来时已经瘦了一大圈。</div>
      </div>
      <h3>下次写作文，记住这个方法</h3>
      <div class="method"><b>「借物抒情 · 三个问题法」：</b>先想“哪件事最打动我 / 为什么”，再挑“走丢被找到”详写，把拆狗窝、发现麻绳的过程放慢动作写。</div>
      <h3>给家长的小练习</h3>
      <p>1. 让孩子把“拆狗窝救黄豆”的过程放慢成三个动作讲出来，练把动作写具体。</p>
      <p>2. 和孩子聊“黄豆哪个瞬间最让你舍不得”，把心里的感受写进作文。</p>
      <div class="closing">宝贝，你已经会用具体画面写故事了。再让最打动你的那件事慢慢展开，你的作文会更动人。老师会一直陪着你改。</div>
      <h3>附录：作文原文 + 逐段旁批</h3>
      <div class="passage">
        <div class="para"><div class="text">你的心爱之物是什么？乐高？玩具熊？我的心爱之物是家乡养的小黄狗黄豆。</div><div class="note">第一段亮出心爱之物，用两个问句吊起兴趣，再点出答案，起笔抓人。</div></div>
        <div class="para"><div class="text">黄豆有一双炯炯有神的金色眼睛，而且自带眼线，脸上那块黄色斑点与它身上黑色的毛发格格不入，却彰显着它的独特。</div><div class="note">第二段写黄豆的样子。用「放大镜」凑近看，抓住「自带眼线」「格格不入却彰显独特」，写得又准又有个性。</div></div>
        <div class="para"><div class="text">黄豆十分淘气。</div><div class="note">第三段只有一句，作用是总起，把下面几件事都罩住了。</div></div>
        <div class="para"><div class="text">上次，黄豆在奶奶家看见了邻居家笼子上的老鼠，想都不想便扑了上去，结果自己反被沾了一身虱子。我和姐姐为它洗澡，它竟然抓了我一把。</div><div class="note">第四段写抓老鼠。写得有画面，看见老鼠「想都不想便扑上去」。字词上「扒」改成「沾」、「最板上」改成「笼子上」。</div></div>
        <div class="para"><div class="text">还有一次，黄豆消失了一整天，大家找遍了整个大院，最终在小狗海海的狗窝里找到了它。它应该是被压住了，大家说干就干，拆了大半个狗窝才看见它——它的后腿上缠了根麻绳，死死地缠住它，动弹不得。最后，黄豆瘦了一大圈。</div><div class="note">第五段写走丢又被找回来，是全文写得最细的一件，「拆了大半个狗窝才看见它」很有画面。可以挑这件详写。</div></div>
        <div class="para"><div class="text">家雀儿是我们院子的老住户了，一家六口其乐融融地在院西电箱上，可是黄豆的出现，打破了它们的快乐生活。</div><div class="note">第六段把视角转到家雀儿，和后面被打破形成对比。「在黄豆的出现」改成「可是黄豆的出现」。</div></div>
        <div class="para"><div class="text">最开始，黄豆只是眼巴巴地望着雀窝，后来它叫来了附近村子的流浪猫，一起捣鸟巢，可真是一副「大将军」的架子呢！</div><div class="note">第七段写黄豆逗鸟，「大将军的架子」比喻传神，把黄豆得意的神气写活了。</div></div>
        <div class="para"><div class="text">就这样，黄豆把老大的院子搞得枝折花落。可惜黄豆在 17 天前走了，院中少了一位「瘸腿将军」。黄豆，我希望某一天你能回到这片土地，让我们的院子重新充满阳光！</div><div class="note">第八段是结尾，写黄豆离开和不舍，情感真。</div></div>
      </div>
    </div>`;
}
