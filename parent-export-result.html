<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家长版批改报告</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#eef0f3}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .wrap{display:flex;justify-content:center;padding:0 0 24px}
  .wrap img{display:block;width:100%;max-width:1000px;height:auto;background:#fff}
</style>
</head>
<body>
<div class="wrap">
  <img id="reportImg" src="report-text.png" alt="家长版批改报告（文字版）">
</div>
<script>
  var mode = new URLSearchParams(location.search).get('mode');
  var img = document.getElementById('reportImg');
  if (mode === 'image') {
    img.src = 'report-image.png';
    img.alt = '家长版批改报告（学生原图版）';
  } else {
    img.src = 'report-text.png';
    img.alt = '家长版批改报告（文字版）';
  }
</script>
</body>
</html>
